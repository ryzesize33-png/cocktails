<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Lion Inspired Custom Cocktail Order</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            height: 100%;
            background-color: #1a1a1a;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .header-bar {
            background-color: #1a1a1a;
            border-bottom: 2px solid #c5a86a;
            color: #f5f5f0;
            text-align: center;
            padding: 15px 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            position: relative;
            z-index: 10;
        }
        .header-bar h1 {
            font-family: 'Georgia', serif;
            font-size: 1.3rem;
            color: #c5a86a;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .header-bar p {
            font-size: 0.8rem;
            color: #a6a6a6;
            margin-top: 3px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .frame-container {
            position: absolute;
            top: 68px;
            bottom: 0;
            left: 0;
            right: 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            background-color: #1a1a1a;
        }
        iframe {
            width: 100%;
            height: 5400px; /* Extended to display your full menu tiers, herbs, and validation flawlessly */
            border: none;
            background-color: #1a1a1a;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <h1>Bespoke Lounge</h1>
        <p>Crafted At Your Table</p>
    </div>

    <div class="frame-container">
        <!-- Direct secure link to your full premium cocktail form -->
        <iframe src="https://docs.google.com/forms/d/e/1FAIpQLScr7oZ00D_19UU60hIAApe4NSWE3dEjpVFw57vhGjUclB16Xw/viewform?embedded=true" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
    </div>

</body>
</html>
