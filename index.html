<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Lion Inspired Custom Cocktail Order</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-bg: #262626;
            --primary-gold: #c5a86a;
            --primary-gold-hover: #b39556;
            --text-light: #f5f5f0;
            --text-muted: #a6a6a6;
            --border-color: #3d3d3d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Playfair Display', 'Georgia', serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
            padding-bottom: 60px;
        }

        .header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 1px solid var(--primary-gold);
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 1.8rem;
            letter-spacing: 2px;
            color: var(--primary-gold);
            text-transform: uppercase;
        }

        .header p {
            font-family: 'Arial', sans-serif;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 5px;
            letter-spacing: 1px;
        }

        .section-title {
            font-size: 1.1rem;
            color: var(--primary-gold);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background-color: var(--border-color);
        }

        .form-group {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-family: 'Arial', sans-serif;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 8px;
            color: var(--text-light);
            letter-spacing: 0.5px;
        }

        input[type="text"], select, textarea {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-light);
            font-family: 'Arial', sans-serif;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-gold);
        }

        .grid-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .checkbox-btn {
            position: relative;
        }

        .checkbox-btn input[type="checkbox"],
        .checkbox-btn input[type="radio"] {
            position: absolute;
            opacity: 0;
            cursor: pointer;
            height: 0;
            width: 0;
        }

        .checkbox-label {
            display: block;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 12px;
            text-align: center;
            border-radius: 4px;
            font-family: 'Arial', sans-serif;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .checkbox-btn input:checked + .checkbox-label {
            background-color: var(--primary-gold);
            border-color: var(--primary-gold);
            color: var(--bg-color);
            font-weight: bold;
        }

        .slider-container {
            padding: 10px 0;
        }

        .slider {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: var(--border-color);
            outline: none;
            margin: 15px 0;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--primary-gold);
            cursor: pointer;
        }

        .slider-labels {
            display: flex;
            justify-content: space-between;
            font-family: 'Arial', sans-serif;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .submit-btn {
            width: 100%;
            background-color: var(--primary-gold);
            color: var(--bg-color);
            border: none;
            padding: 16px;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background-color: var(--primary-gold-hover);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Bespoke Lounge</h1>
        <p>Custom Cocktail Crafted At Your Table</p>
    </div>

    <form id="cocktailForm" onsubmit="sendOrder(event)">
        
        <div class="section-title">Table Details</div>
        <div class="form-group">
            <label for="tableNumber">Table or Service Number</label>
            <input type="text" id="tableNumber" placeholder="e.g., Table 14" required>
        </div>

        <div class="section-title">1. Choose Your Canvas</div>
        <div class="form-group grid-options">
            <div class="checkbox-btn">
                <input type="radio" id="spirit-gin" name="spirit" value="Gin" checked>
                <label for="spirit-gin" class="checkbox-label">Gin</label>
            </div>
            <div class="checkbox-btn">
                <input type="radio" id="spirit-vodka" name="spirit" value="Vodka">
                <label for="spirit-vodka" class="checkbox-label">Vodka</label>
            </div>
            <div class="checkbox-btn">
                <input type="radio" id="spirit-whiskey" name="spirit" value="Whiskey">
                <label for="spirit-whiskey" class="checkbox-label">Whiskey</label>
            </div>
            <div class="checkbox-btn">
                <input type="radio" id="spirit-mocktail" name="spirit" value="Mocktail (Non-Alc)">
                <label for="spirit-mocktail" class="checkbox-label">Mocktail</label>
            </div>
        </div>

        <div class="section-title">2. Flavor Profiles</div>
        <div class="form-group grid-options">
            <div class="checkbox-btn">
                <input type="checkbox" id="flavor-sweet" name="flavors" value="Sweet">
                <label for="flavor-sweet" class="checkbox-label">Sweet</label>
            </div>
            <div class="checkbox-btn">
                <input type="checkbox" id="flavor-sour" name="flavors" value="Sour">
                <label for="flavor-sour" class="checkbox-label">Sour</label>
            </div>
            <div class="checkbox-btn">
                <input type="checkbox" id="flavor-herbal" name="flavors" value="Herbal">
                <label for="flavor-herbal" class="checkbox-label">Herbal</label>
            </div>
            <div class="checkbox-btn">
                <input type="checkbox" id="flavor-spicy" name="flavors" value="Spicy">
                <label for="flavor-spicy" class="checkbox-label">Spicy</label>
            </div>
        </div>

        <div class="section-title">3. Intensity Profile</div>
        <div class="form-group slider-container">
            <label for="intensity">Desired Strength</label>
            <input type="range" min="1" max="3" value="2" class="slider" id="intensity">
            <div class="slider-labels">
                <span>Light & Crisp</span>
                <span>Balanced</span>
                <span>Bold & Direct</span>
            </div>
        </div>

        <div class="section-title">4. Finishing Touches</div>
        <div class="form-group">
            <label for="notes">Dietary Notes / Specific Requests</label>
            <textarea id="notes" rows="3" placeholder="e.g., No citrus, extra dry, or add a star anise touch..."></textarea>
        </div>

        <button type="submit" class="submit-btn">Send Order to Bartender</button>
    </form>

    <script>
        function sendOrder(event) {
            event.preventDefault();
            
            const barEmail = "yourbar-orders@example.com";
            
            const table = document.getElementById('tableNumber').value;
            const spirit = document.querySelector('input[name="spirit"]:checked').value;
            
            const selectedFlavors = [];
            document.querySelectorAll('input[name="flavors"]:checked').forEach((checkbox) => {
                selectedFlavors.push(checkbox.value);
            });
            const flavorProfile = selectedFlavors.length > 0 ? selectedFlavors.join(', ') : 'Balanced/Classic';
            
            const intensityVal = document.getElementById('intensity').value;
            const intensityLabels = ["Light & Crisp", "Balanced", "Bold & Direct"];
            const intensity = intensityLabels[intensityVal - 1];
            
            const notes = document.getElementById('notes').value || "None";
            
            const emailSubject = encodeURIComponent(`🍸 New Order: ${table}`);
            const emailBody = encodeURIComponent(
                `CUSTOM COCKTAIL TICKET\n` +
                `======================\n` +
                `Location: ${table}\n\n` +
                `Base Profile: ${spirit}\n` +
                `Flavors Selected: ${flavorProfile}\n` +
                `Drink Intensity: ${intensity}\n\n` +
                `Notes/Allergies: ${notes}\n` +
                `======================`
            );
            
            window.location.href = `mailto:${barEmail}?subject=${emailSubject}&body=${emailBody}`;
        }
    </script>
</body>
</html>
